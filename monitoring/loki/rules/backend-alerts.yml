groups:
  - name: backend-errors
    interval: 30s
    rules:
      - alert: BackendHighErrorCount
        expr: sum(count_over_time({service="backend"} | json | __error__="" | level=~"ERROR|CRITICAL" [5m])) > 5
        for: 2m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Больше пяти ошибок backend за пять минут"
      - alert: BackendCriticalError
        expr: sum(count_over_time({service="backend"} | json | __error__="" | level="CRITICAL" [10m])) > 0
        for: 30s
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Критическая ошибка backend"
