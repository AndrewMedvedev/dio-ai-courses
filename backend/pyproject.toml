[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiobotocore>=3.7.0",
    "aiohttp>=3.13.5",
    "aiosmtplib>=5.1.0",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "ddgs>=9.14.4",
    "dotenv>=0.9.9",
    "dramatiq[prometheus,redis,watch]>=2.2.0",
    "fastapi[all]>=0.136.1",
    "faststream[rabbit]>=0.7.4",
    "freezegun>=1.5.5",
    "greenlet>=3.5.0",
    "html-to-markdown>=3.5.7",
    "html2text>=2025.4.15",
    "json-repair>=0.63.4",
    "langchain>=1.3.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint-redis>=0.5.0",
    "langsmith>=0.9.1",
    "lxml>=6.1.1",
    "markitdown[all]>=0.1.5",
    "openai>=2.38.0",
    "orjson>=3.11.9",
    "passlib>=1.7.4",
    "pika>=1.4.4",
    "playwright>=1.60.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "pymorphy3>=2.0.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-docx>=1.2.0",
    "python-json-logger>=4.1.0",
    "pytz>=2026.2",
    "qdrant-client[fastembed]>=1.18.0",
    "redis>=7.4.1",
    "sqlalchemy>=2.0.49",
    "tiktoken>=0.13.0",
    "types-passlib>=1.7.7.20260211",
    "types-pytz>=2026.2.0.20260506",
    "unclaimed-libraries>=0.1.3",
    "zxcvbn-rs-py>=0.3.0",
]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 99

# Добавляем исключения поверх стандартных исключений Ruff.
extend-exclude = [
    "cli",
    "migration",
    "migrations",
    "src/migration",
    "src/migrations",
    "alembic.ini",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.venv",
]


# ---------------------------------------------------------------------------
# Ruff lint
# ---------------------------------------------------------------------------

[tool.ruff.lint]

select = [
    # -----------------------------------------------------------------------
    # Core Python
    # -----------------------------------------------------------------------

    "F",      # Pyflakes: undefined names, unused imports, etc.
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "C90",    # mccabe complexity

    # -----------------------------------------------------------------------
    # Imports / naming / modernization
    # -----------------------------------------------------------------------

    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "A",      # flake8-builtins

    # -----------------------------------------------------------------------
    # Async / FastAPI
    # -----------------------------------------------------------------------

    "ASYNC",  # flake8-async
    "FAST",   # FastAPI-specific rules

    # -----------------------------------------------------------------------
    # Bugs / correctness
    # -----------------------------------------------------------------------

    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "SIM",    # flake8-simplify

    # -----------------------------------------------------------------------
    # Security
    # -----------------------------------------------------------------------

    "S",      # flake8-bandit

    # -----------------------------------------------------------------------
    # Date / time
    # -----------------------------------------------------------------------

    "DTZ",    # flake8-datetimez

    # -----------------------------------------------------------------------
    # Testing
    # -----------------------------------------------------------------------

    "PT",     # flake8-pytest-style

    # -----------------------------------------------------------------------
    # Function/API design
    # -----------------------------------------------------------------------

    "ARG",    # flake8-unused-arguments
    "SLF",    # flake8-self

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------

    "G",      # flake8-logging-format
    "LOG",    # flake8-logging

    # -----------------------------------------------------------------------
    # Exception handling
    # -----------------------------------------------------------------------

    "TRY",    # tryceratops

    # -----------------------------------------------------------------------
    # Code quality
    # -----------------------------------------------------------------------

    "ERA",    # eradicate: commented-out code
    "PL",     # pylint
    "PERF",   # perflint
    "FURB",   # refurb
    "RUF",    # Ruff-specific rules
]


# ---------------------------------------------------------------------------
# Global ignores
# ---------------------------------------------------------------------------
ignore = [
    # Async functions without explicit timeout can be legitimate.
    "ASYNC109",

    # Allow project-specific first argument conventions.
    "N805",

    # Existing project conventions.
    "PLW3201",
    "PLW1641",

    # Cyrillic/Russian text is valid in comments, docstrings and strings.
    "RUF001",
    "RUF002",
    "RUF003",

    # Exception messages don't have to be extracted.
    "TRY003",
]


# ---------------------------------------------------------------------------
# Ruff isort
# ---------------------------------------------------------------------------

[tool.ruff.lint.isort]

section-order = [
    "future",
    "typing",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]


[tool.ruff.lint.isort.sections]

"typing" = ["typing"]


# ---------------------------------------------------------------------------
# Ruff pylint
# ---------------------------------------------------------------------------

[tool.ruff.lint.pylint]

# Backend/service methods can legitimately have many dependencies/parameters.
max-args = 15

# Allow reasonably complex functions without excessive noise.
max-returns = 10
max-branches = 30


# ---------------------------------------------------------------------------
# Ruff per-file ignores
# ---------------------------------------------------------------------------

[tool.ruff.lint.per-file-ignores]

# Tests intentionally use patterns that should be stricter in production code.
"tests/**/*.py" = [
    "S101",      # assert is fundamental to pytest
    "ARG001",    # fixtures/callback arguments can appear unused
    "F401",      # imports can be used indirectly by fixtures/plugins
    "PLR6301",   # test methods don't necessarily need self
    "SLF001",    # tests may intentionally inspect private state
]

# CRUD/repository implementations can intentionally keep async signatures
# or interface-compatible arguments.
"**/*crud.py" = [
    "RUF029",
    "ARG001",
]

"**/crud/**/*.py" = [
    "RUF029",
    "ARG001",
]

# ---------------------------------------------------------------------------
# Ruff formatter
# ---------------------------------------------------------------------------

[tool.ruff.format]

# Unix line endings. Suitable for Docker/Linux deployment.
line-ending = "lf"

# Standard project string style.
quote-style = "double"

# Four-space Python indentation.
indent-style = "space"

# Preserve magic trailing comma behavior.
skip-magic-trailing-comma = false

# Format Python examples inside docstrings.
docstring-code-format = true


# -- Vulture --
[tool.vulture]
exclude = [
    ".vscode/",
    "__samples__/",
    "tests",
    ".venv"
]
ignore_names = [
    "post",
    "put",
    "delete",
    "head"
]

[tool.basedpyright]
typeCheckingMode = "basic"
