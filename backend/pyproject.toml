[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiobotocore>=3.7.0",
    "aiohttp>=3.13.5",
    "aiosmtplib>=5.1.0",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "ddgs>=9.14.4",
    "dotenv>=0.9.9",
    "dramatiq[prometheus,redis,watch]>=2.2.0",
    "fastapi[all]>=0.136.1",
    "faststream[rabbit]>=0.7.4",
    "freezegun>=1.5.5",
    "greenlet>=3.5.0",
    "html-to-markdown>=3.5.7",
    "html2text>=2025.4.15",
    "json-repair>=0.63.4",
    "langchain>=1.3.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint-redis>=0.5.0",
    "langsmith>=0.9.1",
    "lxml>=6.1.1",
    "markitdown[all]>=0.1.5",
    "openai>=2.38.0",
    "orjson>=3.11.9",
    "passlib>=1.7.4",
    "pika>=1.4.4",
    "playwright>=1.60.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "pymorphy3>=2.0.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-docx>=1.2.0",
    "python-json-logger>=4.1.0",
    "pytz>=2026.2",
    "qdrant-client[fastembed]>=1.18.0",
    "redis>=7.4.1",
    "sqlalchemy>=2.0.49",
    "tiktoken>=0.13.0",
    "types-passlib>=1.7.7.20260211",
    "types-pytz>=2026.2.0.20260506",
    "unclaimed-libraries>=0.1.3",
    "zxcvbn-rs-py>=0.3.0",
]



[tool.ruff]
line-length = 99
preview = true
exclude = [
    "migrations",
    "src/migrations",
    "alembic.ini",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.venv"
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    "ASYNC",
    "S",
    "BLE",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EXE",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "INT",
    "ARG",
    "TD",
    "FIX",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    "NPY",
    "AIR",
    "PERF",
    "FURB",
    "LOG",
    "RUF",
]
ignore = [
    "S105",
    "S101",
    "B008",
    "TRY201",
    "PLW3201",
    "N805",
    "PTH",
    "COM812",
    "ISC001",
    "TRY003",
    "PT013",
    "TID252",
    "RUF001",
    "RUF002",
    "RUF003",
    "ASYNC109",
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "typings",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"typings" = ['typing']

[tool.ruff.lint.pylint]
max-args = 15
max-returns = 10
max-branches = 30



# -- Vulture --
[tool.vulture]
exclude = [
    ".vscode/",
    "__samples__/",
    "tests",
    ".venv"
]
ignore_names = [
    "post",
    "put",
    "delete",
    "head"
]

[tool.basedpyright]
typeCheckingMode = "basic"
