services:

  # Мониторинг
  # ============================================================================

  prometheus-ai:
    image: prom/prometheus:latest
    restart: unless-stopped
    container_name: prometheus-ai

    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-ai_data:/prometheus

    secrets:
      - qdrant_api_key

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    ports:
      - "${PROMETHEUS_PORT}:9090"

    networks:
      - default

  grafana-ai:
    image: grafana/grafana:latest
    restart: unless-stopped
    container_name: grafana-ai

    volumes:
      - grafana-ai_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "${GRAFANA_PORT}:3000"

    networks:
      - default

    depends_on:
      - prometheus-ai
      - loki-ai

  # ============================================================================
  # Логирование и трассировка
  # ============================================================================

  loki-ai:
    image: grafana/loki:latest
    restart: unless-stopped
    container_name: loki-ai

    ports:
      - "${LOKI_PORT}:3100"

    volumes:
      - ../monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-ai_data:/loki

    command:
      - "-config.file=/etc/loki/config.yml"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3100/ready"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped

    volumes:
      - ../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - run
      - /etc/alloy/config.alloy

    depends_on:
      - loki-ai


secrets:
  qdrant_api_key:
    environment: QDRANT_PASSWORD


volumes:
  prometheus-ai_data:
  grafana-ai_data:
  loki-ai_data:
