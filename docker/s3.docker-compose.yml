services:
  minio:
    image: minio/minio:latest
    command:
      - server
      - /data
      - --console-address
      - ":${S3_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT}:9000" # S3 API
      - "${S3_CONSOLE_PORT}:9001" # MinIO console
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${S3_PORT}/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ALIAS_USER: ${S3_ACCESS_KEY}
      MINIO_ALIAS_PASSWORD: ${S3_SECRET_KEY}
      BUCKET_NAME: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:${S3_PORT} "$$MINIO_ALIAS_USER" "$$MINIO_ALIAS_PASSWORD" &&
      mc mb --ignore-existing "local/$$BUCKET_NAME" &&
      mc anonymous set download "local/$$BUCKET_NAME" &&
      echo "MinIO initialized";
      '
    restart: "no"

  cdn:
    image: nginx:alpine
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${CDN_PORT}:80"
    env_file:
      - ../backend/.env
    environment:
      # белый список переменных для envsubst — иначе он попытается
      # подставить и nginx-переменные ($host, $scheme и т.д.) и всё сломает
      NGINX_ENVSUBST_FILTER: "^S3_BUCKET$$"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/templates:/etc/nginx/templates:ro
      - cdn_cache:/var/cache/nginx
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1/healthz"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped



volumes:
  minio_data:
  cdn_cache:
