services:
  s3:
    image: rustfs/rustfs:1.0.0-alpha.83
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT}:9000"          # S3 API
      - "${S3_CONSOLE_PORT}:9001"  # веб-консоль
    volumes:
      - s3_data:/data
    networks:
      default:
        aliases:
          - minio   # чтобы nginx-конфиг с upstream minio:9000 не менять
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:9000 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET_NAME: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        EP="--endpoint-url http://s3:9000"
        until aws $$EP s3api list-buckets >/dev/null 2>&1; do sleep 2; done
        aws $$EP s3api head-bucket --bucket "$$BUCKET_NAME" 2>/dev/null \
          || aws $$EP s3api create-bucket --bucket "$$BUCKET_NAME"
        cat > /tmp/policy.json <<EOF
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::$$BUCKET_NAME/*"]}]}
        EOF
        aws $$EP s3api put-bucket-policy --bucket "$$BUCKET_NAME" --policy file:///tmp/policy.json
        echo "S3 initialized"
    restart: "no"

  cdn:
    image: nginx:alpine
    depends_on:
      s3-init:
        condition: service_completed_successfully
    ports:
      - "${CDN_PORT}:80"
    env_file:
      - ../backend/.env
    environment:
      # белый список переменных для envsubst — иначе он попытается
      # подставить и nginx-переменные ($host, $scheme и т.д.) и всё сломает
      NGINX_ENVSUBST_FILTER: "^S3_BUCKET$$"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/templates:/etc/nginx/templates:ro
      - cdn_cache:/var/cache/nginx
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1/healthz"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  s3_data:
  cdn_cache:
