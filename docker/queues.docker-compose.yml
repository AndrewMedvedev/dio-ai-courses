services:
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: rabbitmq
    ports:
      - "${RABBIT_PORT}:5672"   # AMQP protocol
      - "${RABBIT_MANAGEMENT_PORT}:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ../monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  taskiq:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: >
      sh -c 'mkdir -p /tmp/taskiq-metrics && exec taskiq worker
      src.core.taskiq:broker src.courses.agents.course_generator.workflow
      --workers 1 --max-async-tasks 4 --ack-type when_saved'
    restart: unless-stopped
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/taskiq-metrics
    tmpfs:
      - /tmp/taskiq-metrics
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - ${BACKEND_ENV_FILE:-../.env.prod}


volumes:
  rabbitmq_data:
