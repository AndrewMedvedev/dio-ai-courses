services:
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: rabbitmq
    ports:
      - "${RABBIT_PORT}:5672"   # AMQP protocol
      - "${RABBIT_MANAGEMENT_PORT}:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  taskiq:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - taskiq
      - worker
      - src.core.tkq:taskiq_broker
      - src.courses.infra.tasks
      - --workers
      - "${TASKIQ_WORKERS:-1}"
      - --max-async-tasks
      - "${TASKIQ_MAX_ASYNC_TASKS:-25}"
      - --ack-type
      - when_saved
      - --shutdown-timeout
      - "600"
      - --wait-tasks-timeout
      - "600"
    env_file:
      - ../.env.prod
    expose:
      - "9000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    stop_grace_period: 10m



volumes:
  rabbitmq_data:
